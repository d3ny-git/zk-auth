# Static client + proving key + reverse proxy to the Crow server, on one
# origin (http://localhost:8080), so the browser needs no CORS and the SIWE
# domain the wallet shows is the page's own host.
server {
    listen 8080;
    # The server rejects login bodies over 16 KB itself, but only after
    # buffering them; refusing them here first bounds memory (threat model).
    client_max_body_size 16k;

    root /usr/share/nginx/html;
    index index.html;

    location ~ \.mjs$ { default_type application/javascript; }

    # The proving key: immutable for a given setup (the client caches it by
    # SHA-256), so only the manifest must never be cached.
    location = /keys/pk.bin { alias /data/keys/pk.bin; }
    location = /keys/manifest.json { alias /data/keys/manifest.json; add_header Cache-Control "no-cache"; }

    location /api/ {
        proxy_pass http://server:8081/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }
}
